<nav [ngClass]="{'sidebar': true, 'd-flex': true, 'flex-column': true, 'collapsed': collapsed}" >
  <div class="sidebar-brand d-flex align-items-center justify-content-center py-3 position-relative">
    <img [src]="logoSrc" alt="" height="60" class="sidebar-logo" />
    <!-- Botón de colapsar menú eliminado -->
  </div>
  <hr class="sidebar-divider my-2" />
  <div class="sidebar-heading d-flex align-items-center px-3" style="position: relative; min-height: 40px;">
    <span style="color: #fff; font-weight: 600; display: flex; align-items: center;">
      <a [routerLink]="tituloModulo === 'Multimedia' ? '/modulos/multimedia' : '/modulos/gestion-web'" style="color: #fff; text-decoration: none; font-weight: 600; display: flex; align-items: center;">
        <i class="fas me-1" [ngClass]="tituloModulo === 'Multimedia' ? 'fa-photo-video' : 'fa-globe'"></i>
        <span *ngIf="!collapsed">{{ tituloModulo }}</span>
      </a>
    </span>
   
    <span class="sidebar-icons" style="position: absolute; right: 18px; top: 50%; transform: translateY(-50%); display: flex; align-items: center;">
      <a routerLink="/modulos" title="Selector de módulos" style="color: #fff; opacity: 0.85; display: flex; align-items: center;">
        <i class="fas fa-th-large"></i>
      </a>
      <a *ngIf="canViewGrupos" routerLink="/admin/conceptos/grupos" title="Grupos de conceptos" style="color: #fff; opacity: 0.85; display: flex; align-items: center; margin-left: 0.5rem;">
        <i class="fas fa-layer-group"></i>
      </a>
    </span>
  </div>




  <!-- Menú dinámico debajo del selector de módulos -->
  <ul *ngIf="menu && menu.length > 0" class="nav flex-column mt-2 menu-dropdown-root">
    <app-sidebar-menu-item
      *ngFor="let item of menu"
      [item]="item"
      [collapsed]="collapsed"
      [depth]="0">
    </app-sidebar-menu-item>
    
  </ul>


    <!-- Mostrar sección de Grupos separada cuando estamos en el módulo Conceptos -->
    <div *ngIf="tituloModulo === 'Conceptos' && canViewGrupos">
      <hr class="sidebar-divider mt-2 mb-2" />
      <div class="sidebar-section-title">GRUPOS</div>
      <ul class="nav flex-column mt-2 menu-dropdown-root">
        <app-sidebar-menu-item
          *ngFor="let item of gruposMenuFiltered"
          [item]="item"
          [collapsed]="collapsed"
          [depth]="0">
        </app-sidebar-menu-item>
      </ul>
      <hr class="sidebar-divider mt-2 mb-2" />
    </div>
  
  
    


 
</nav>
