<nav [ngClass]="{'sidebar': true, 'd-flex': true, 'flex-column': true, 'collapsed': collapsed}" >
  <div class="sidebar-brand d-flex align-items-center justify-content-center py-3 position-relative">
    <img [src]="logoSrc" alt="" height="60" class="sidebar-logo" />
    <!-- Botón de colapsar menú eliminado -->
  </div>
  <hr class="sidebar-divider my-2" />
  <div class="sidebar-heading d-flex align-items-center px-3" style="position: relative; min-height: 40px;">
    <span style="color: #fff; font-weight: 600; display: flex; align-items: center;">
      <a [routerLink]="tituloModulo === 'Multimedia' ? '/modulos/multimedia' : '/modulos/gestion-web'" style="color: #fff; text-decoration: none; font-weight: 600; display: flex; align-items: center;">
        <i class="fas me-1" [ngClass]="tituloModulo === 'Multimedia' ? 'fa-photo-video' : 'fa-globe'"></i>
        <span *ngIf="!collapsed">{{ tituloModulo }}</span>
      </a>
    </span>
   
    <span class="sidebar-icons" style="position: absolute; right: 18px; top: 50%; transform: translateY(-50%); display: flex; align-items: center;">
      <a routerLink="/modulos" title="Selector de módulos" style="color: #fff; opacity: 0.85; display: flex; align-items: center;">
        <i class="fas fa-th-large"></i>
      </a>
      <button *ngIf="esAdmin && (tituloModulo === 'Kilo Vivo')" (click)="crearPagina.emit()" title="Nueva página" style="background: none; border: none; padding: 0; margin: 0; color: #fff; line-height: 1; cursor: pointer; display: flex; align-items: center;">
        <i class="fas fa-plus"></i>
      </button>
    </span>
  </div>


  <hr class="sidebar-divider mt-3 mb-2" />
  <div class="sidebar-section-title">SUS OPCIONES</div>
  <hr class="sidebar-divider mt-2 mb-2" />

  <!-- Menú dinámico debajo del selector de módulos -->
  <ul *ngIf="menu && menu.length > 0" class="nav flex-column mt-2 menu-dropdown-root">
    <app-sidebar-menu-item
      *ngFor="let item of menu"
      [item]="item"
      [collapsed]="collapsed"
      [depth]="0">
    </app-sidebar-menu-item>
  </ul>

  <!-- Menú Opciones solo en Multimedia -->
  <li *ngIf="tituloModulo === 'Multimedia'" class="nav-item" [ngClass]="{'active': componentsOpen}">
    <a class="nav-link collapsed d-flex align-items-center" href="#" (click)="componentsOpen = !componentsOpen; $event.preventDefault()" [attr.aria-expanded]="componentsOpen" aria-controls="collapseOpciones" style="display: flex; justify-content: space-between;">
      <span class="d-flex align-items-center">
        <i class="fas fa-fw fa-sliders-h"></i>
        <span class="ms-2" style="font-size:0.88em;">Opciones</span>
      </span>
      <i class="fas" [ngClass]="{'fa-angle-down': !componentsOpen, 'fa-angle-up': componentsOpen}" style="margin-left: auto;"></i>
    </a>
    <div *ngIf="componentsOpen" @slideDown aria-labelledby="headingOpciones">
      <ul class="nav flex-column mt-2 menu-dropdown-root">
        <li class="nav-item">
          <a class="nav-link d-flex align-items-center py-1 px-2" style="font-size:0.88em; min-height:32px;" routerLink="/modulos/multimedia/carga-masiva" routerLinkActive="active">
            <i class="fas fa-cloud-upload-alt me-2" style="font-size:1em;"></i> Carga Masiva
          </a>
        </li>
      </ul>
    </div>
  </li>
 
</nav>
