<app-navbar [user]="user" [sitioActual]="sitioActual" [showSidebarToggle]="false" class="navbar-app-selector"></app-navbar>

<!-- Contenido: Selector de módulos -->
<div class="module-selector-body d-flex flex-column align-items-center justify-content-center">
  <div class="text-center mb-4">
    <h3 class="module-title mb-1">Módulos disponibles</h3>
    <p class="module-subtitle small mb-0">Selecciona un módulo para continuar</p>
  </div>

  <div *ngIf="loading" class="text-center my-5">
    <div class="spinner-border text-success" role="status">
      <span class="visually-hidden">Cargando...</span>
    </div>
    <div class="mt-2">Cargando módulos...</div>
  </div>
  <div *ngIf="error && !loading" class="alert alert-danger text-center my-4">
    {{ error }}
  </div>
  <div *ngIf="!loading && !error && !hasVisibleMenus" class="alert alert-warning text-center my-4">
    No hay módulos principales habilitados para este usuario.
  </div>
  <div *ngIf="!loading && !error" class="w-100 module-groups-grid">
    <section *ngFor="let grupo of grupos; let gi = index" class="module-group" [style.animation-delay]="gi * 60 + 'ms'">
      <div class="d-flex flex-nowrap justify-content-start gap-4 module-row">
        <div *ngFor="let permiso of grupo.permisos; let i = index"
             class="module-card card text-center p-4 shadow module-card--enter"
             [style.--enter-delay]="(gi * 90 + i * 70) + 'ms'"
             (click)="seleccionar(permiso)">
          <span class="module-count-badge" *ngIf="permiso.itemCount !== undefined && permiso.itemCount !== null && permiso.itemCount > 0 && !shouldShowEmployeeStats(permiso)">
            {{ permiso.itemCount }}
          </span>
          <div class="module-icon mb-3">
            <i *ngIf="permiso.icono" [ngClass]="permiso.icono"></i>
          </div>
          <h5 class="card-title employee-card-title">
            {{ permiso.nombre }}

            <span class="employee-title-count" *ngIf="shouldShowEmployeeStats(permiso) && countFor('empleados') > 0">
              {{ countFor('empleados') }}
            </span>
          </h5>
          <p class="card-text text-muted small">{{ permiso.descripcion }}</p>
          <div class="module-employee-stats module-employee-stats--bottom" *ngIf="shouldShowEmployeeStats(permiso)">
            <div class="employee-states-row" *ngIf="getEmployeeStates().length > 0">
              <ng-container *ngFor="let estado of getEmployeeStates()">
                <span class="employee-state-stat" *ngIf="estado.count > 0" [ngClass]="{ 'employee-state-stat--inactive': estado.label.toLowerCase() !== 'activo' }">
                  <strong>{{ estado.count }}</strong>
                  <small>{{ estado.label }}</small>
                </span>
              </ng-container>
            </div>
          </div>
        </div>
      </div>
    </section>
  </div>
</div>

<!-- Footer -->
<app-footer></app-footer>
