<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="utf-8">
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      background: #f1f5f9;
      font-family: system-ui;
    }

    .quick-access-root {
      position: fixed;
      right: 1.1rem;
      bottom: 1.4rem;
      z-index: 5000;
    }

    .quick-access-bubble {
      position: absolute;
      right: 3.65rem;
      bottom: .35rem;
      background: rgba(15, 23, 42, .92);
      color: #fff;
      font-size: .76rem;
      font-weight: 700;
      padding: .35rem .6rem;
      border-radius: 999px;
      white-space: nowrap;
      pointer-events: none;
      opacity: 1;
      transform: translateX(0) scale(1);
      transition: opacity .2s ease, transform .2s ease;
    }

    .quick-access-bubble.hidden {
      opacity: 0;
      transform: translateX(6px) scale(0.92);
    }

    .quick-access-toggle {
      width: 3.45rem;
      height: 3.45rem;
      border: 0;
      border-radius: 999px;
      color: #fff;
      background: linear-gradient(135deg, #0f766e 0%, #0b5f59 100%);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: transform .22s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .quick-access-panel {
      position: absolute;
      right: 0;
      bottom: 4.05rem;
      width: 16.4rem;
      padding: .7rem;
      background: rgba(255, 255, 255, .96);
      border-radius: 18px;
      box-shadow: 0 18px 40px rgba(15, 23, 42, .18);
      transform-origin: bottom right;
      opacity: 0;
      visibility: hidden;
      transform: translateY(10px) scale(0.95);
      pointer-events: none;
      transition: opacity .22s ease, transform .24s ease, visibility .24s step-end;
    }

    .quick-access-panel.visible {
      opacity: 1;
      visibility: visible;
      transform: translateY(0) scale(1);
      pointer-events: auto;
      transition: opacity .24s ease, transform .26s cubic-bezier(0.16, 1, 0.3, 1), visibility 0s step-start;
    }

    .quick-access-item {
      display: block;
      padding: .6rem;
      color: #0f172a;
      text-decoration: none;
    }
  </style>
</head>

<body>
  <div class="quick-access-root" id="root">
    <div class="quick-access-bubble" id="bubble">Rápidos</div>
    <button type="button" class="quick-access-toggle" id="btn">⚡</button>
    <div class="quick-access-panel" id="panel">
      <strong>Accesos rápidos</strong>
      <a class="quick-access-item" href="#">Inicio</a>
      <a class="quick-access-item" href="#">Liquidar</a>
    </div>
  </div>
  <script>
    const btn = document.getElementById('btn');
    const panel = document.getElementById('panel');
    const bubble = document.getElementById('bubble');
    const root = document.getElementById('root');
    let open = false;
    btn.onclick = () => {
      open = !open;
      root.classList.toggle('open', open);
      panel.classList.toggle('visible', open);
      bubble.classList.toggle('hidden', open);
    };
  </script>
</body>

</html>
