<div class="usuario-password-shell">
  <app-loading-spinner></app-loading-spinner>

  <div class="hero-card">
    <div class="hero-card-content">
      <div>
        <div class="module-breadcrumb">
          <a routerLink="/modulos">Módulos</a>
          <span>/</span>
          <a routerLink="/admin/usuarios">Usuarios</a>
          <span>/</span>
          <span>{{ titulo }}</span>
        </div>
        <h1>{{ titulo }}</h1>
        <p>{{ subtitulo }}</p>
      </div>
      <div class="hero-actions">
        <button type="button" class="btn-action btn-icon" (click)="volver()" title="Volver" aria-label="Volver">
          <i class="bi bi-arrow-left"></i>
        </button>
      </div>
    </div>
  </div>

  <div class="form-card">
    <form [formGroup]="form" (ngSubmit)="guardar()">
      <div class="form-grid">
        <div class="field" *ngIf="isSelfMode">
          <label for="current_password">Contraseña actual</label>
          <input id="current_password" type="password" formControlName="current_password" autocomplete="current-password" placeholder="Ingrese su contraseña actual" />
          <small class="field-error" *ngIf="currentPasswordControl?.touched && currentPasswordControl?.invalid">Debe ingresar su contraseña actual.</small>
        </div>

        <div class="field">
          <label for="nueva_password">Nueva contraseña</label>
          <input id="nueva_password" type="password" formControlName="nueva_password" autocomplete="new-password" placeholder="Nueva contraseña" />
          <small class="field-error" *ngIf="form.get('nueva_password')?.touched && form.get('nueva_password')?.invalid">Ingrese una contraseña válida.</small>
        </div>

        <div class="field">
          <label for="confirm_password">Confirmar nueva contraseña</label>
          <input id="confirm_password" type="password" formControlName="confirm_password" autocomplete="new-password" placeholder="Confirme la contraseña" />
          <small class="field-error" *ngIf="form.get('confirm_password')?.touched && (form.get('confirm_password')?.invalid || form.errors?.['passwordMismatch'])">Las contraseñas no coinciden.</small>
        </div>
      </div>

      <div *ngIf="error" class="form-error-box">
        {{ error }}
      </div>

      <div class="form-footer">
        <button type="button" class="btn-secondary-action" (click)="volver()">Cancelar</button>
        <button type="submit" class="btn-primary-action" [disabled]="saving">
          {{ saving ? 'Procesando...' : submitLabel }}
        </button>
      </div>
    </form>
  </div>

  <app-modal-alerta
    [visible]="resultVisible"
    [titulo]="resultTitle"
    [mensaje]="resultMessage"
    [icono]="'bi bi-check-circle-fill'"
    [accentColor]="'#198754'"
    [buttonColor]="'#198754'"
    [esConfirmacion]="false"
    (cerrar)="cerrarResultado()">
  </app-modal-alerta>

  <app-modal-alerta
    [visible]="errorVisible"
    [titulo]="errorTitle"
    [mensaje]="errorMessage"
    [icono]="'bi bi-exclamation-triangle-fill'"
    [accentColor]="'#d32f2f'"
    [buttonColor]="'#d32f2f'"
    [esConfirmacion]="false"
    (cerrar)="cerrarError()">
  </app-modal-alerta>
</div>
