<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Sistema de Sueldos</title>
  <base href="/ingreso/">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <link rel="icon" type="image/png" href="assets/logos/app.png">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="fonts/bootstrap-icons.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body>
  <!-- Loader de arranque: cubre el hueco entre el HTML y el bootstrap de Angular.
       Angular lo reemplaza por <app-loading-screen> y lo elimina al terminar. -->
  <div id="boot-preloader" aria-live="polite" aria-busy="true" aria-label="Cargando la aplicación">
    <div class="boot-preloader-card">
      <div class="boot-preloader-spinner"><span></span></div>
      <p class="boot-preloader-text">Cargando...</p>
      <div class="boot-preloader-bar"><span></span></div>
    </div>
  </div>

  <app-root></app-root>

  <style>
    #boot-preloader {
      position: fixed;
      inset: 0;
      z-index: 10000;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(248, 250, 252, 0.86);
      backdrop-filter: blur(14px) saturate(140%);
      -webkit-backdrop-filter: blur(14px) saturate(140%);
      transition: opacity 0.45s cubic-bezier(0.4, 0, 0.2, 1), visibility 0s linear 0s;
    }
    #boot-preloader.is-hiding { opacity: 0; visibility: hidden; transition: opacity 0.45s cubic-bezier(0.4,0,0.2,1), visibility 0s linear 0.45s; }

    .boot-preloader-card {
      display: flex; flex-direction: column; align-items: center; gap: 1.15rem;
      padding: 2.25rem 2.5rem;
      background: rgba(255,255,255,0.86);
      border: 1px solid rgba(15,23,42,0.06);
      border-radius: 20px;
      box-shadow: 0 1px 2px rgba(15,23,42,0.04), 0 12px 32px -8px rgba(15,23,42,0.12);
    }
    .boot-preloader-spinner { position: relative; width: 56px; height: 56px; display: grid; place-items: center; }
    .boot-preloader-spinner::before {
      content: ''; position: absolute; inset: 0; border-radius: 50%;
      border: 3px solid rgba(40,53,147,0.12);
    }
    .boot-preloader-spinner span {
      position: absolute; inset: 0; border-radius: 50%;
      border: 3px solid transparent; border-top-color: #283593; border-right-color: rgba(40,53,147,0.45);
      animation: bp-spin 0.85s cubic-bezier(0.55,0.15,0.4,0.85) infinite;
    }
    .boot-preloader-text { margin: 0; font-size: 0.95rem; font-weight: 600; letter-spacing: 0.01em; color: #1f2a44; }
    .boot-preloader-bar { position: relative; width: 180px; height: 3px; border-radius: 999px; background: rgba(40,53,147,0.1); overflow: hidden; }
    .boot-preloader-bar span {
      position: absolute; top: 0; bottom: 0; width: 45%; border-radius: 999px;
      background: linear-gradient(90deg,#283593,#5c6bc0);
      animation: bp-progress 1.4s cubic-bezier(0.65,0,0.35,1) infinite;
    }
    @keyframes bp-spin { to { transform: rotate(360deg); } }
    @keyframes bp-progress { 0% { left: -45%; } 100% { left: 100%; } }
    @media (prefers-reduced-motion: reduce) {
      #boot-preloader { transition: none; }
      .boot-preloader-spinner span, .boot-preloader-bar span { animation: none; }
      .boot-preloader-bar span { left: 0; width: 100%; opacity: 0.55; }
    }
    @media (max-width: 480px) {
      .boot-preloader-card { padding: 1.75rem 1.5rem; border-radius: 18px; gap: 1rem; }
      .boot-preloader-spinner { width: 48px; height: 48px; }
      .boot-preloader-bar { width: 140px; }
    }
  </style>

  <script>
    // Retira el loader del HTML apenas Angular monta la aplicación.
    (function () {
      var el = document.getElementById('boot-preloader');
      if (!el) return;
      var done = false;
      function dismiss() {
        if (done) return;
        done = true;
        el.classList.add('is-hiding');
        setTimeout(function () { el.remove(); }, 500);
      }
      // El componente Angular se encarga del cierre final del overlay.
      window.addEventListener('load', function () { setTimeout(dismiss, 200); });
      setTimeout(dismiss, 6000); // salvaguarda: nunca deja el loader bloqueando la app
    })();
  </script>
</body>
</html>
